<title>Perwira Idol Season 2 — Panel Juri</title>
<style>
  :root{
    --bg-void:#0a0e14;
    --bg-panel:#10161f;
    --bg-card:#141b26;
    --line:#22303f;
    --cyan:#38f0e0;
    --cyan-dim:#1c8f86;
    --amber:#ffb347;
    --amber-dim:#a56b1f;
    --red:#ff5c6c;
    --green:#3ddc84;
  }
  *{
    box-sizing: border-box;
    -webkit-tap-highlight-color:transparent;
  }
  body{
    margin: 0;
    padding: 0;
    background:
      radial-gradient(circle at 15% 0%, rgba(56,240,224,0.07), transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(255,179,71,0.06), transparent 45%),
      var(--bg-void);
    color:#e7edf3;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height:100vh;
  }
  .font-display{font-family:'Arial Black', 'Segoe UI', sans-serif; letter-spacing:0.02em;}
  .mono{font-family:'Consolas','Courier New',monospace;}
  .spotlight-text{
    background:linear-gradient(90deg,var(--cyan),var(--amber));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .panel{background:var(--bg-panel);border:1px solid var(--line);border-radius:16px;}
  .card{background:var(--bg-card);border:1px solid var(--line);border-radius:14px;transition:all .2s ease;}
  .card:active{transform:scale(0.98);}
  .badge-wait{background:rgba(255,179,71,0.15);color:var(--amber);border:1px solid var(--amber-dim);}
  .badge-done{background:rgba(61,220,132,0.15);color:var(--green);border:1px solid #1f7a4c;}
  .btn-primary{background:linear-gradient(90deg,var(--cyan-dim),var(--cyan));color:#00201d;font-weight:800;border:none;cursor:pointer;}
  .btn-primary:active{filter:brightness(0.9);}
  .btn-save{background:linear-gradient(90deg,#1f9e5c,var(--green));color:#00220f;font-weight:900;border:none;cursor:pointer;}
  .btn-save:disabled{background:#2a3340;color:#5b6b7a;}
  input[type=range]{-webkit-appearance:none;height:10px;border-radius:6px;background:#1c2733;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--cyan) 60%);border:3px solid #04231f;cursor:pointer;
    box-shadow:0 0 12px rgba(56,240,224,0.6);}
  .circuit-line{position:relative;overflow:hidden;}
  .circuit-line::before{content:'';position:absolute;inset:0;
    background-image:
      linear-gradient(90deg, transparent 95%, rgba(56,240,224,0.15) 95%, rgba(56,240,224,0.15) 100%),
      linear-gradient(0deg, transparent 92%, rgba(255,179,71,0.08) 92%, rgba(255,179,71,0.08) 100%);
    background-size:40px 40px; opacity:0.6; pointer-events:none;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:#0f2a22;border:1px solid #1f7a4c;color:var(--green);padding:14px 22px;border-radius:12px;
    font-weight:700;transition:all .3s ease;z-index:2000;box-shadow:0 10px 30px rgba(0,0,0,.5);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .modal-backdrop{background:rgba(4,6,10,0.85);backdrop-filter:blur(4px);}
  ::-webkit-scrollbar{width:6px;height:6px;} ::-webkit-scrollbar-thumb{background:var(--cyan-dim);border-radius:4px;}
  .live-dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);
    animation:pulse 1.4s infinite; display:inline-block;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .gear-ring{width:16px;height:16px;border:2px solid var(--cyan-dim);border-radius:50%;position:relative;display:inline-block;}
  .gear-ring::after{content:'';position:absolute;inset:-4px;border:2px dashed rgba(56,240,224,0.3);border-radius:50%;
    animation:spin 6s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  input[type=text],input[type=password],input[type=number],select{
    background:#0d1420;border:1px solid var(--line);color:#e7edf3;border-radius:10px;padding:12px 14px;
  }
  input[type=text]:focus,input[type=password]:focus,input[type=number]:focus,select:focus{outline:2px solid var(--cyan-dim);}
  table{border-collapse:collapse;}
  th,td{border-bottom:1px solid var(--line);}

  /* ===== SIDEBAR STYLES ===== */
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 280px;
    height: 100%;
    background: var(--bg-panel);
    border-right: 1px solid var(--line);
    z-index: 1000;
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 10px 0 30px rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
  }
  .sidebar.open {
    transform: translateX(0);
  }
  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4, 6, 10, 0.75);
    backdrop-filter: blur(4px);
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .sidebar-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    color: #cbd5e1;
    text-decoration: none;
    border-radius: 10px;
    margin: 4px 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .sidebar-item:hover, .sidebar-item.active {
    background: rgba(56, 240, 224, 0.12);
    color: var(--cyan);
    border: 1px solid var(--cyan-dim);
  }
  .hamburger-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--cyan);
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hamburger-btn:hover {
    background: rgba(56, 240, 224, 0.1);
  }

  /* ===== PERWIRA IDOL SEASON 2 — POSTER DNA v5 ===== */
  :root{
    --bg-void:#030314;
    --bg-panel:rgba(8,8,30,.94);
    --bg-card:rgba(13,12,39,.90);
    --line:rgba(82,123,190,.32);
    --cyan:#42d9ff;
    --cyan-dim:#137da0;
    --amber:#ff405c;
    --amber-dim:#9f2444;
    --red:#ff315d;
    --green:#41e4b6;
    --purple:#9658ff;
    --gold:#f2d179;
    --white:#f8fbff;
  }

  html{background:#030314;}
  body{
    position:relative;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 8% 0%, rgba(255,28,63,.17), transparent 27%),
      radial-gradient(circle at 87% 4%, rgba(115,44,255,.20), transparent 30%),
      radial-gradient(circle at 50% 105%, rgba(0,203,255,.12), transparent 42%),
      linear-gradient(180deg,#040315 0%,#05041a 48%,#02030e 100%);
    color:#f4f6ff;
  }
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:-2;
    background:
      linear-gradient(90deg, transparent 0 3.8%, rgba(255,38,75,.32) 4%, transparent 4.15%),
      linear-gradient(90deg, transparent 19%, rgba(95,35,255,.16) 19.15%, transparent 19.35%),
      linear-gradient(90deg, transparent 47%, rgba(111,40,255,.14) 47.1%, transparent 47.28%),
      linear-gradient(90deg, transparent 84%, rgba(0,210,255,.12) 84.12%, transparent 84.3%);
    filter:blur(.2px);
  }
  body::after{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:-1;
    opacity:.15;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:linear-gradient(to bottom,rgba(0,0,0,.5),transparent 75%);
  }

  .font-display{
    font-family:'Arial Narrow','Roboto Condensed','Arial Black','Segoe UI',sans-serif;
    letter-spacing:.055em;
    text-transform:uppercase;
  }
  .spotlight-text{
    background:linear-gradient(105deg,#fff 0%,#f7f8ff 28%,#5ce3ff 58%,#ff4867 92%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 24px rgba(66,217,255,.10);
  }

  .panel{
    background:
      linear-gradient(180deg,rgba(13,13,45,.96),rgba(5,6,24,.96));
    border:1px solid rgba(79,199,255,.25);
    border-radius:10px;
    box-shadow:
      0 16px 42px rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,255,255,.035),
      0 0 0 1px rgba(153,72,255,.06);
  }
  .card{
    position:relative;
    background:linear-gradient(145deg,rgba(14,13,43,.97),rgba(7,8,29,.95));
    border:1px solid rgba(113,92,185,.36);
    border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.025);
  }
  .card::before{
    content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;
    background:linear-gradient(180deg,var(--red),var(--purple),var(--cyan));
    box-shadow:0 0 12px rgba(255,49,93,.45);
    border-radius:2px;
  }
  .card:active{transform:scale(.992);}

  .circuit-line::before{
    background-image:
      linear-gradient(90deg, transparent 96%, rgba(66,217,255,.12) 96%, rgba(66,217,255,.12) 100%),
      linear-gradient(0deg, transparent 94%, rgba(255,49,93,.08) 94%, rgba(255,49,93,.08) 100%);
    background-size:54px 54px;
    opacity:.65;
  }

  .btn-primary,.btn-save{
    position:relative;
    overflow:hidden;
    background:linear-gradient(100deg,#19c9f1 0%,#7656ff 50%,#ff315d 100%);
    color:white;
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 7px 20px rgba(64,41,170,.28),0 0 22px rgba(255,49,93,.12);
    text-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .btn-primary::after,.btn-save::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.20) 48%,transparent 70%);
    transform:translateX(-130%);transition:transform .45s ease;
  }
  .btn-primary:hover::after,.btn-save:hover::after{transform:translateX(130%);}
  .btn-primary:active,.btn-save:active{filter:brightness(.88);transform:translateY(1px);}
  .btn-save:disabled{background:#24243c;color:#777a95;border-color:#34354d;box-shadow:none;}

  input[type=text],input[type=password],input[type=number],select{
    background:rgba(2,4,20,.82);
    border:1px solid rgba(89,115,173,.46);
    color:#fff;
    border-radius:7px;
    box-shadow:inset 0 1px 8px rgba(0,0,0,.24);
  }
  input[type=text]:focus,input[type=password]:focus,input[type=number]:focus,select:focus{
    outline:none;
    border-color:var(--cyan);
    box-shadow:0 0 0 2px rgba(66,217,255,.12),0 0 18px rgba(66,217,255,.10);
  }
  input[type=range]{height:8px;background:linear-gradient(90deg,rgba(255,49,93,.32),rgba(150,88,255,.32),rgba(66,217,255,.32));border:1px solid rgba(103,105,170,.28);}
  input[type=range]::-webkit-slider-thumb{
    width:28px;height:28px;background:#fff;border:4px solid #12132b;
    box-shadow:0 0 0 2px var(--cyan),0 0 18px rgba(66,217,255,.65);
  }

  .sidebar{
    width:292px;
    background:linear-gradient(180deg,rgba(4,4,20,.985),rgba(8,6,30,.985));
    border-right:1px solid rgba(73,210,255,.27);
    box-shadow:18px 0 55px rgba(0,0,0,.55),2px 0 0 rgba(255,45,88,.25);
  }
  .sidebar::after{
    content:"";position:absolute;top:0;right:-1px;width:2px;height:100%;
    background:linear-gradient(180deg,var(--red),var(--purple) 48%,var(--cyan));
    opacity:.7;box-shadow:0 0 16px rgba(135,80,255,.45);
  }
  .sidebar-item{
    border:1px solid transparent;
    border-radius:7px;
    color:#cdd1e2;
    text-transform:uppercase;
    font-size:.82rem;
    letter-spacing:.045em;
  }
  .sidebar-item:hover,.sidebar-item.active{
    background:linear-gradient(90deg,rgba(255,45,88,.11),rgba(101,69,255,.12),rgba(66,217,255,.08));
    color:#fff;
    border-color:rgba(66,217,255,.23);
    box-shadow:inset 3px 0 0 var(--red),0 0 20px rgba(66,217,255,.05);
  }
  .hamburger-btn{
    border:1px solid rgba(66,217,255,.38);
    color:#fff;
    border-radius:7px;
    background:linear-gradient(145deg,rgba(255,49,93,.08),rgba(66,217,255,.08));
    box-shadow:0 0 16px rgba(66,217,255,.08);
  }

  .poster-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.64rem;letter-spacing:.20em;text-transform:uppercase;color:#c2c6dc;}
  .poster-eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);}
  .poster-section-title{font-family:'Arial Narrow','Arial Black',sans-serif;text-transform:uppercase;letter-spacing:.075em;color:#fff;}

  header.panel{
    position:sticky;top:0;z-index:50;
    margin:0 0 14px!important;
    padding:10px 14px!important;
    border-radius:0;
    border-left:0;border-right:0;border-top:0;
    background:rgba(4,4,19,.91);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 8px 26px rgba(0,0,0,.34),0 1px 0 rgba(66,217,255,.16);
  }
  header.panel::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,var(--red),transparent 24%,var(--purple) 54%,transparent 75%,var(--cyan));
    box-shadow:0 0 12px rgba(98,91,255,.35);
  }

  .badge-wait{
    background:rgba(112,76,255,.10);color:#d6d1ff;border:1px solid rgba(139,106,255,.42);
  }
  .badge-done{
    background:rgba(48,211,185,.10);color:#8df8df;border:1px solid rgba(65,228,182,.40);
  }
  .toast{background:#090b23;border-color:rgba(66,217,255,.42);color:#fff;box-shadow:0 12px 34px rgba(0,0,0,.55),0 0 24px rgba(66,217,255,.12);}
  .live-dot{background:var(--red);box-shadow:0 0 10px var(--red);}
  .gear-ring{border-color:var(--cyan);}
  .gear-ring::after{border-color:rgba(255,49,93,.42);}

  table{width:100%;}
  th{
    color:#fff;
    background:rgba(85,54,180,.13);
    text-transform:uppercase;
    letter-spacing:.055em;
    font-size:.72rem;
  }
  th,td{border-bottom:1px solid rgba(104,111,169,.22);}
  tr:hover td{background:rgba(66,217,255,.025);}

  /* Existing utility color classes remapped to the poster palette. */
  .text-cyan-300{color:var(--cyan);}
  .text-amber-300{color:#ff5a70;}
  .text-red-400{color:#ff5a78;}
  .text-slate-300{color:#d7daea;}
  .text-slate-400{color:#9ba3c1;}
  .text-slate-500{color:#747c9e;}

  #stageLabel{
    display:inline-flex;align-items:center;min-height:36px;padding:7px 12px;
    border:1px solid rgba(255,49,93,.28);border-radius:6px;
    background:linear-gradient(90deg,rgba(255,49,93,.08),rgba(107,65,255,.08));
    color:#fff!important;font-size:.92rem;
  }
  #cardsWrap{max-width:980px;margin-left:auto!important;margin-right:auto!important;}
  #adminContent{max-width:1180px;margin-left:auto!important;margin-right:auto!important;padding-bottom:24px;}

  @media (max-width:639px){
    .brand-logo-header{width:92px;max-height:48px;}
    .brand-copy .brand-kicker{display:none;}
    .brand-title{font-size:.72rem;letter-spacing:.07em;}
    header.panel{padding:8px 10px!important;}
    .poster-login{padding-top:18px;}
    .poster-login-card{border-radius:9px;}
    .panel{border-radius:9px;}
    .card{border-radius:7px;}
  }

</style>

<div id="app"></div>

<script>




// ---------------- SAFE STORAGE ----------------
// Beberapa lingkungan (iframe sandbox, webview, mode privat) memblokir akses
// localStorage dan melempar error yang tidak tertangkap. Jika ini terjadi pada
// baris teratas skrip, SELURUH skrip berhenti sebelum sempat memanggil render(),
// sehingga halaman tampak kosong. Bungkus semua akses agar aplikasi tetap jalan.
const safeStorage = {
  get(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  },
  set(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* abaikan, tidak fatal */ }
  },
  remove(key) {
    try { localStorage.removeItem(key); } catch (e) { /* abaikan, tidak fatal */ }
  }
};

// ---------------- STATE ----------------
// Ambil state dari cache jika ada, agar langsung login & tampil seketika

let isSidebarOpen = false;
let adminTab = "setting"; // Tab default panel admin (sebelumnya tidak dideklarasikan -> ReferenceError saat login admin)
let cachedState = {};
try {
  cachedState = JSON.parse(safeStorage.get("perwira_state")) || {};
} catch (e) {
  cachedState = {};
}

// Sesi versi lama (sebelum token backend) sengaja tidak dipakai lagi agar
// setelah update ini semua user login ulang satu kali dan mendapat token role.
const cachedUserWithToken = (cachedState.user && cachedState.user.token) ? cachedState.user : null;
if (cachedState.user && !cachedState.user.token) {
  // Hapus cache legacy yang mungkin masih menyimpan total dari versi lama.
  safeStorage.remove("perwira_state");
  cachedState = {};
}

let state = {
  user: cachedUserWithToken,
  stage: cachedState.stage || null,
  weights: cachedState.weights || {},
  participants: cachedState.participants || [],
  myScores: {},          
  pollTimer: null,
  scoringTarget: null,   
  sliderValues: {},
  recap: [],
  trendData: null,
  _juriLoadedOnce: !!cachedState.stage, // Jika sudah ada cache, tandai sudah ter-load
  _juriFetchInFlight: false,
  _lastJuriHash: null
};

// ---------------- HELPER LAINNYA...

// ---------------- HELPER UTILS ----------------
function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function toggleSidebar() {
  isSidebarOpen = !isSidebarOpen;
  const sb = document.getElementById("sidebar");
  const overlay = document.getElementById("sidebarOverlay");
  if (sb) sb.classList.toggle("open", isSidebarOpen);
  if (overlay) overlay.classList.toggle("open", isSidebarOpen);
}

function closeSidebar() {
  isSidebarOpen = false;
  const sb = document.getElementById("sidebar");
  const overlay = document.getElementById("sidebarOverlay");
  if (sb) sb.classList.remove("open");
  if (overlay) overlay.classList.remove("open");
}

function selectAdminTab(tab) {
  adminTab = tab;
  closeSidebar();
  render();
}

// ---------------- API HELPER ----------------
async function api(action, params = {}, opts = {}) {
  // Semua request selain login membawa token sesi. Ini mencegah akun Juri
  // memanggil endpoint Admin (rekap/trend/config) secara langsung dari browser.
  const requestParams = { ...params };
  if (action !== "login" && state.user?.token) requestParams.token = state.user.token;
  const payload = encodeURIComponent(JSON.stringify(requestParams));
  const url = `${SCRIPT_URL}?action=${action}&payload=${payload}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "Unknown error");
    return data.result;
  } catch (err) {
    console.error("API error:", err);
    if (!opts.silent) showToast("Gagal terhubung ke server: " + err.message, true);
    throw err;
  }
}

function showToast(msg, isError = false) {
  let t = document.getElementById("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    t.className = "toast";
    document.body.appendChild(t);
  }
  t.style.borderColor = isError ? "rgba(255,49,93,.58)" : "rgba(66,217,255,.48)";
  t.style.color = isError ? "#ff7087" : "#eafbff";
  t.style.background = isError ? "#210713" : "#080a22";
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2600);
}

// ---------------- GLOBAL SIDEBAR COMPONENT ----------------
function renderSidebar() {
  return `
  <div id="sidebarOverlay" class="sidebar-overlay ${isSidebarOpen ? 'open' : ''}" onclick="closeSidebar()"></div>
  <aside id="sidebar" class="sidebar ${isSidebarOpen ? 'open' : ''}">

function bindLogin() {
  document.getElementById("btnLogin").onclick = async () => {
    const username = document.getElementById("loginUser").value.trim();
    const password = document.getElementById("loginPass").value;
    const btn = document.getElementById("btnLogin");
    const errEl = document.getElementById("loginError");
    
    errEl.classList.add("hidden");
    if (!username || !password) return;

    // UI Feedback: Ubah tombol saat proses
    const originalText = btn.textContent;
    btn.textContent = "MEMUAT...";
    btn.disabled = true;
    btn.style.opacity = "0.7";

    // Potongan kode di dalam fungsi bindLogin() bagian try-catch
try {
  const result = await api("login", { username, password });
  if (result && result.success) {
    state.user = { username: result.username, role: result.role, token: result.token || null };
    
    // TANGKAP DATA GABUNGAN: Jika Juri dan data sudah dilampirkan dari backend
    if (result.role === "Juri" && result.stage) {
      state.stage = result.stage;
      state.weights = result.weights || {};
      state.participants = result.participants || [];
      state._juriLoadedOnce = true; // Tandai bahwa data sudah termuat
    }
    
    // Simpan seluruh state ke local storage
    safeStorage.set("perwira_state", JSON.stringify({
      user: state.user,
      stage: state.stage,
      weights: state.weights,
      participants: state.participants
    }));
    
    render();
  } else {
    errEl.textContent = "Username atau password salah.";
    errEl.classList.remove("hidden");
    btn.textContent = originalText;
    btn.disabled = false;
    btn.style.opacity = "1";
  }
} catch (e) {
  errEl.textContent = "Tidak bisa terhubung ke server.";
  errEl.classList.remove("hidden");
  btn.textContent = originalText;
  btn.disabled = false;
  btn.style.opacity = "1";
}
  };
}

// ---- ADMIN: KOREKSI NILAI (TRANSPARAN + AUDIT TRAIL) ----
window._adjustmentStage = "";
window._adjustmentJuriFilter = "";

async function renderAdminAdjustments(content) {
  await ensureJuriList();
  let activeStage = STAGES[0];
  try {
    const cfg = window._settingCfgCache || await api("getAdminConfig", {}, { silent: true });
    activeStage = cfg.activeStage || activeStage;
  } catch (e) {}

  const stage = window._adjustmentStage || activeStage;
  const juri = window._adjustmentJuriFilter || "";
  content.innerHTML = `<div class="text-slate-400 p-6 text-center">Memuat koreksi nilai...</div>`;

  try {
    const data = await api("getAdminScoreAdjustments", { stage, juri });
    paintAdminAdjustments(content, data);
  } catch (e) {
    content.innerHTML = `<div class="text-red-400 p-6 text-center">Gagal memuat data koreksi nilai.</div>`;
  }
}

              <th class="py-2 pr-2">No</th>
              <th class="py-2 pr-2">Peserta</th>
              <th class="py-2 pr-2 text-right">Nilai Asli</th>
              <th class="py-2 pr-2">Koreksi Admin</th>

        renderAdminAdjustments(content);

      }
    };
  });

function formatAdjustmentTime(value) {
  try {
    const d = new Date(value);
    if (isNaN(d.getTime())) return String(value || '');
    return d.toLocaleString('id-ID', { dateStyle:'short', timeStyle:'short' });
  } catch (e) { return String(value || ''); }
}


async function refreshJuriData() {
  if (state._juriFetchInFlight) return;
  state._juriFetchInFlight = true;
  const isBackgroundPoll = state._juriLoadedOnce === true;
  try {
    const result = await api("getJuriState", {}, { silent: isBackgroundPoll });
    state._juriLoadedOnce = true;
    state.stage = result.stage;

    // PRIVACY JURI: backend tidak lagi mengirim bobot maupun total. Frontend juga
    // hanya menyimpan status penilaian + nilai per kriteria untuk kebutuhan edit.
    state.weights = {};
    state.participants = (result.participants || []).map(np => ({
      nomorUrut: np.nomorUrut,
      nama: np.nama,
      lagu: np.lagu,
      grupAsli: np.grupAsli,
      sudahDinilai: np.sudahDinilai === true || np.sudahDinilai === "true" || np.sudahDinilai === 1,
      scores: np.scores || null
    }));

    // Cache lokal sengaja tidak menyimpan total/bobot untuk akun Juri.
    safeStorage.set("perwira_state", JSON.stringify({
      user: state.user,
      stage: state.stage,
      weights: {},
      participants: state.participants
    }));

    const newHash = JSON.stringify({ stage: state.stage, participants: state.participants });
    if (newHash !== state._lastJuriHash) {
      state._lastJuriHash = newHash;
      renderCards();
    }
  } catch (e) {
    // Abaikan polling background agar UI tidak berkedip; error request manual
    // tetap ditangani oleh api().
  } finally {
    state._juriFetchInFlight = false;
  }
}

// Deteksi babak Battle TOP22 memakai logika yang sama seperti Spinner Admin
// (lihat isTOP22 di renderSpinner), supaya kartu penilaian juri otomatis
// dikelompokkan per pasangan battle pada babak ini.
function isBattleStage(stage) {
  const s = (stage || "").toUpperCase();
  return s.includes("TOP22") || s.includes("BATTLE");
}

function computeCardInfo(p) {
  const isDone = p && (p.sudahDinilai === true || p.sudahDinilai === "true" || p.sudahDinilai === 1 || p.isScored);
  return { isDone: !!isDone };
}

function cardHtml(p) {
  const { isDone } = computeCardInfo(p);

  return `
      <div class="card p-4 flex items-center justify-between" data-nomor="${p.nomorUrut}">
        <div class="flex items-center gap-4">
          <div class="font-display text-3xl text-cyan-300 w-12 text-center">${p.nomorUrut}</div>
          <div>
            <div class="font-bold text-lg leading-tight">${escapeHtml(p.nama)}</div>
            <div class="text-slate-400 text-sm">${escapeHtml(p.lagu)}</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          ${isDone ? `
            <span class="text-xs font-bold px-3 py-1-5 rounded-full" style="color:#cbd5e1;border:1px solid #475569;background:rgba(71,85,105,0.12);">NILAI TERSIMPAN</span>
            <button class="btnEditScore text-xs font-bold px-3 py-1-5 rounded-full" data-nomor="${p.nomorUrut}" style="cursor:pointer;border:1px solid var(--cyan-dim);background:rgba(56,240,224,0.08);color:var(--cyan);" title="Edit Nilai Peserta Ini">
              ✎ EDIT
            </button>
          ` : `
            <span class="text-xs font-bold px-3 py-1-5 rounded-full badge-wait">BELUM DINILAI</span>
          `}
        </div>
      </div>
    `;
}

function renderCards() {
  const label = document.getElementById("stageLabel");
  if (label) label.textContent = state.stage || "Belum ada babak aktif";
  const wrap = document.getElementById("cardsWrap");
  if (!wrap) return;
  if (!state.participants.length) {
    wrap.innerHTML = `<div class="panel p-6 text-center text-slate-400">Belum ada peserta di babak ini.</div>`;
    return;
  }

  if (isBattleStage(state.stage)) {
    // Kelompokkan kartu berdasarkan pasangan battle: urutan NomorUrut 1&2 =
    // Battle #1, 3&4 = Battle #2, dst — konsisten dengan cara backend/spinner
    // admin menomori pasangan battle saat pengundian.
    const sorted = [...state.participants].sort((a, b) => Number(a.nomorUrut) - Number(b.nomorUrut));
    const pairs = [];
    for (let i = 0; i < sorted.length; i += 2) {
      pairs.push([sorted[i], sorted[i + 1]].filter(Boolean));
    }
    // Label "GRUP #N" diambil dari kolom "GrupAsli" di Sheets (identitas grup
    // tetap yang dikunci backend), BUKAN dari posisi urutan tampil saat ini —
    // supaya label grup di Panel Juri tidak ikut berubah walau NomorUrut
    // berubah akibat hasil spin. Fallback ke posisi pasangan (idx+1) hanya
    // kalau GrupAsli belum sempat terisi di backend.
    wrap.innerHTML = pairs.map((pair, idx) => {
      const rawGid = pair[0] ? pair[0].grupAsli : null;
      const gid = (rawGid !== null && rawGid !== undefined && rawGid !== '') ? Number(rawGid) : (idx + 1);
      return `
      <div class="panel p-3 circuit-line" style="border-color:var(--cyan-dim);">
        <div class="text-center mb-2">
          <span class="font-display text-sm text-amber-300 tracking-wider">⚔️ GRUP #${gid}</span>
        </div>
        <div class="space-y-2">
          ${pair.map((p, pi) => cardHtml(p)).join(
            pair.length === 2 ? `<div class="text-center text-xs font-display text-red-400">VS</div>` : ""
          )}
        </div>
      </div>
    `;
    }).join("");
  } else {
    wrap.innerHTML = state.participants.map(p => cardHtml(p)).join("");
  }

  wrap.querySelectorAll(".card").forEach(el => {
    el.onclick = (e) => {
      if (e.target.closest(".btnEditScore")) return; // ditangani listener tombol edit sendiri
      const nomor = el.dataset.nomor;
      const p = state.participants.find(x => String(x.nomorUrut) === String(nomor));
      const { isDone } = computeCardInfo(p);
      if (isDone) return;
      openScoreModal(p, false);
    };
  });

  wrap.querySelectorAll(".btnEditScore").forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const nomor = btn.dataset.nomor;
      const p = state.participants.find(x => String(x.nomorUrut) === String(nomor));
      if (p) openScoreModal(p, true);
    };
  });
}

function openScoreModal(p, isEdit) {
  state.scoringTarget = p;
  state.editMode = !!isEdit;
  state.sliderValues = {};
  CRITERIA.forEach(c => {
    const prev = isEdit && p.scores ? Number(p.scores[c.key]) : NaN;
    state.sliderValues[c.key] = !isNaN(prev) ? prev : 50;
  });
  const modalWrap = document.getElementById("modalWrap");
  modalWrap.innerHTML = `
  <div class="fixed inset-0 modal-backdrop flex items-end sm:items-center justify-center z-50" id="modalBackdrop">
    <div class="panel w-full sm:max-w-md max-h-92vh overflow-y-auto p-5 circuit-line" style="border-radius:20px 20px 0 0;">
      <div class="text-center mb-4">
        ${state.editMode ? '<div class="text-xs font-bold text-amber-300 tracking-wider mb-1">✎ MODE EDIT NILAI</div>' : ''}
        <div class="font-display text-2xl spotlight-text">#${p.nomorUrut} ${escapeHtml(p.nama)}</div>
        <div class="text-slate-400">${escapeHtml(p.lagu)}</div>
      </div>

      <div class="text-xs text-slate-400 text-center mb-4">Nilai setiap kriteria secara independen sesuai penampilan aktual peserta.</div>

      <div id="slidersWrap" class="space-y-5"></div>
      <button id="btnSaveScore" class="btn-save w-full py-4 rounded-xl text-xl mt-6">${state.editMode ? 'SIMPAN PERUBAHAN' : 'SIMPAN NILAI'}</button>
      <button id="btnCancelModal" class="w-full py-3 mt-2 text-slate-400 text-sm" style="background:transparent;border:none;cursor:pointer;">Batal</button>
    </div>
  </div>`;
  const slidersWrap = document.getElementById("slidersWrap");
  slidersWrap.innerHTML = CRITERIA.map(c => {
    const v = state.sliderValues[c.key];
    return `
    <div>
      <div class="flex justify-between items-baseline mb-1">
        <label class="font-semibold">${c.label}</label>
        <span id="val-${c.key}" class="font-display text-3xl text-amber-300">${v}</span>
      </div>
      <input type="range" min="0" max="100" value="${v}" id="slider-${c.key}" class="w-full">
    </div>
  `;
  }).join("");

  CRITERIA.forEach(c => {
    const slider = document.getElementById(`slider-${c.key}`);
    const val = document.getElementById(`val-${c.key}`);
    slider.oninput = () => {
      state.sliderValues[c.key] = Number(slider.value);
      val.textContent = slider.value;
    };
  });

  document.getElementById("btnCancelModal").onclick = closeModal;
  document.getElementById("modalBackdrop").onclick = (e) => { if (e.target.id === "modalBackdrop") closeModal(); };
  document.getElementById("btnSaveScore").onclick = submitScore;
}

function closeModal() {
  document.getElementById("modalWrap").innerHTML = "";
  state.scoringTarget = null;
  state.editMode = false;
}

async function submitScore() {
  const btn = document.getElementById("btnSaveScore");
  const isEdit = !!state.editMode;
  btn.disabled = true;
  btn.textContent = isEdit ? "MENYIMPAN PERUBAHAN..." : "MENYIMPAN...";
  const p = state.scoringTarget;
  try {
    await api("submitScore", {
      juri: state.user.username,
      stage: state.stage,
      nomorUrut: p.nomorUrut,
      nama: p.nama,
      lagu: p.lagu,
      scores: state.sliderValues,
      isEdit: isEdit,
    });
    p.sudahDinilai = true;
    p.scores = { ...state.sliderValues };
    closeModal();
    renderCards();
    showToast(isEdit ? "Perubahan Nilai Berhasil Disimpan!" : "Nilai Berhasil Disimpan!");
  } catch (e) {
    btn.disabled = false;
    btn.textContent = isEdit ? "SIMPAN PERUBAHAN" : "SIMPAN NILAI";
  }
}

function startPolling() {
  stopPolling();
  state.pollTimer = setInterval(() => {
    if (state.user && state.user.role !== "Admin" && !state.scoringTarget) {
      refreshJuriData();
    }
  }, POLL_INTERVAL_MS);
}
function stopPolling() {
  if (state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer = null;
}

// Ambil daftar juri sungguhan dari server (via getAdminConfig, sudah di-cache
// singkat di backend) sekali saja lalu simpan di JURI_LIST -- dipakai oleh
// dropdown filter "Hanya Juri X" di menu Rekap & Trend.
let _juriListFetchInFlight = null;
async function ensureJuriList() {
  if (JURI_LIST.length) return JURI_LIST;
  if (_juriListFetchInFlight) return _juriListFetchInFlight;
  _juriListFetchInFlight = api("getAdminConfig", {}, { silent: true })
    .then(cfg => {
      if (cfg && Array.isArray(cfg.juriList) && cfg.juriList.length) JURI_LIST = cfg.juriList;
      return JURI_LIST;
    })
    .catch(() => JURI_LIST)
    .finally(() => { _juriListFetchInFlight = null; });
  return _juriListFetchInFlight;
}

// spin/reset/acak TIDAK perlu fetch ulang ke Google Sheets (itu yang bikin lambat).

window._settingCfgCache = null;

async function renderSetting(content) {
  // Sama seperti Rekap: tampilkan cache dulu kalau ada (langsung terasa instan
  // saat pindah balik ke tab ini), lalu diam-diam refresh dari server.
  const hasCache = !!window._settingCfgCache;
  let cfg;
  if (hasCache) {
    cfg = window._settingCfgCache;
    paintSetting(content, cfg);
    try {
      const fresh = await api("getAdminConfig", {}, { silent: true });
      window._settingCfgCache = fresh;
      // Hanya lukis ulang diam-diam kalau tab Setting masih yang sedang aktif
      // dan user belum mulai mengetik di form (supaya tidak menimpa input).
      if (adminTab === "setting" && document.activeElement === document.body) {
        paintSetting(content, fresh);

    } catch (e) { /* pakai cache yang sudah tampil */ }

  window._settingCfgCache = cfg;
  paintSetting(content, cfg);

// ---- SPINNER TAB ----
async function renderSpinner(content) {
  // Pakai cache kalau ada, biar re-render setelah spin/reset/acak nama
  // tidak perlu hit ke Google Sheets lagi (itu penyebab lambat).
  let cfg = window._spinnerCfgCache;
  if (!cfg) {
    cfg = await api("getAdminConfig", {});
    window._spinnerCfgCache = cfg;
  }
  const participants = cfg.participants || [];

  // Babak Battle TOP22: satu putaran roda = SATU GRUP BATTLE (isi 2 peserta
  // sekaligus), bukan satu peserta. Roda menampilkan label "Grup #1", "Grup #2",
  // dst — bukan nama peserta — dan setiap kali diputar, roda berhenti pada grup
  // paling depan di antrian (urutan grup mengikuti urutan NomorUrut di Sheets,
  // berpasangan 1&2 = Grup #1, 3&4 = Grup #2, dst). Roda murni gimmick visual;
  // hasilnya selalu grup terdepan sesuai urutan yang sudah diatur di Sheets.
  const isTOP22 = (cfg.activeStage || "").toUpperCase().includes("TOP22") || (cfg.activeStage || "").toUpperCase().includes("BATTLE");

  // Label grup ("Grup #1","Grup #2",dst) SELALU dari kolom "GrupAsli" (identitas
  // tetap yang dikunci sekali oleh backend, lihat readParticipants() di Apps
  // Script) — BUKAN dari posisi/urutan NomorUrut saat ini. Ini penting supaya
  // nama grup tidak ikut berubah walau NomorUrut berubah akibat hasil spin
  // (urutan tampil final). Fallback ke pasangan-per-posisi hanya dipakai kalau
  // backend belum sempat mengisi GrupAsli (mis. request masih diproses).
  function buildGroups(list) {
    const byId = {};
    const ids = [];
    list.forEach((p, idx) => {
      const gid = (p.grupAsli !== null && p.grupAsli !== undefined && p.grupAsli !== '') ? Number(p.grupAsli) : (Math.floor(idx / 2) + 1);
      if (!byId[gid]) { byId[gid] = []; ids.push(gid); }
      byId[gid].push(p);
    });
    ids.sort((a, b) => a - b);
    return ids.map(gid => ({ label: `Grup #${gid}`, members: byId[gid] }));
  }

  // Urutan TAMPIL di spinner dibaca dari kolom "UrutanSpin" di sheet peserta
  // (diisi manual oleh admin, bisa di salah satu/kedua baris tiap grup).
  // Grup dengan UrutanSpin terkecil diputar duluan. Kalau kolom itu kosong
  // untuk suatu grup, fallback ke urutan grup apa adanya (posisi aslinya)
  // supaya babak yang belum diisi UrutanSpin tetap berjalan seperti biasa.
  function groupSpinOrder(group, fallbackIdx) {
    const m1 = group.members[0], m2 = group.members[1];
    const raw = (m1 && m1.urutanSpin !== null && m1.urutanSpin !== undefined) ? m1.urutanSpin
              : (m2 && m2.urutanSpin !== null && m2.urutanSpin !== undefined) ? m2.urutanSpin
              : null;
    const num = raw === null ? NaN : Number(raw);
    return isNaN(num) ? fallbackIdx : num;
  }

  function orderGroupsForSpin(groups) {
    return [...groups].sort((a, b) => {
      const idxA = groups.indexOf(a), idxB = groups.indexOf(b);
      const orderA = groupSpinOrder(a, idxA);
      const orderB = groupSpinOrder(b, idxB);
      if (orderA !== orderB) return orderA - orderB;
      return idxA - idxB; // tie-breaker: urutan asli, biar stabil
    });
  }

  function unitLabel(unit) { return isTOP22 ? unit.label : unit.nama; }

  if (!window._spinnerState || window._spinnerState.stage !== cfg.activeStage) {
    const initialUnits = isTOP22 ? orderGroupsForSpin(buildGroups(participants)) : [...participants];
    window._spinnerState = {
      stage: cfg.activeStage,
      remaining: initialUnits,
      wheelOrder1: shuffleArray([...initialUnits]),
      assigned: [],
      currentAngle1: 0,
      spinCount: 0
    };
  }

  const spState = window._spinnerState;
  const isFinished = spState.remaining.length === 0;
  const nextNo = (spState.assigned || []).length + 1;

  content.innerHTML = `
    <div class="panel p-6 circuit-line text-center">
      <h2 class="font-display text-lg text-amber-300 mb-1">${isTOP22 ? 'Spinner Battle TOP 22' : 'Spinner Undian'} — ${escapeHtml(cfg.activeStage)}</h2>
      <p class="text-xs text-slate-400 mb-4">
        ${isFinished ? '' : (isTOP22
          ? `Mengundi <span class="font-bold text-cyan-300">Grup Urutan Tampil ke${nextNo}</span> (Sisa ${spState.remaining.length} Grup)`
          : `Nomor Urut Berikutnya: <span class="font-bold text-cyan-300">#${nextNo}</span>`)}
      </p>

      <div class="relative mx-auto mb-6" style="width:320px; max-width:100%; aspect-ratio:1/1;">
        <div class="absolute" style="right:-10px; top:50%; transform:translateY(-50%); z-index:20; filter:drop-shadow(-2px 2px 4px rgba(0,0,0,0.5));">
          <svg width="24" height="28" viewBox="0 0 24 28" fill="none">
            <path d="M0 14L24 0V28L0 14Z" fill="#FF3344" stroke="#800000" stroke-width="1"/>
          </svg>
        </div>
        <canvas id="wheelCanvasSingle" width="400" height="400" style="width:100%; height:100%;"></canvas>
      </div>

      <div class="flex flex-wrap gap-2 justify-center max-w-sm mx-auto">
        <button id="btnSpinSingle" class="btn-primary py-2.5 px-6 rounded-xl text-base font-bold shadow-lg flex-1" ${isFinished ? 'disabled style="opacity:0.5;"' : ''}>
          ${isFinished ? (isTOP22 ? 'BATTLE SELESAI' : 'UNDIAN SELESAI') : (isTOP22 ? '🎲 PUTAR GRUP' : '🎲 PUTAR UNDIAN')}
        </button>
        <button id="btnShuffleSingle" class="px-3 py-2.5 rounded-xl border border-slate-600 text-cyan-300 text-xs font-semibold" style="background:transparent;cursor:pointer;" title="Acak Tampilan di Roda" ${spState.remaining.length <= 1 ? 'disabled style="opacity:0.5;"' : ''}>
          🔀 Acak Tampilan
        </button>
        <button id="btnResetSpinSingle" class="px-3 py-2.5 rounded-xl border border-slate-600 text-slate-400 text-xs" style="background:transparent;cursor:pointer;">
          🔄 Reset
        </button>
      </div>
    </div>

    <div class="panel p-4 mt-4 circuit-line">
      ${isTOP22 ? renderBattlePairsTable(spState.assigned) : renderPlainSpinTable(spState.assigned)}
    </div>

    <div id="spinnerModalWrap"></div>
  `;

  const names = isFinished ? ["Selesai"] : spState.wheelOrder1.map(u => unitLabel(u));
  drawWheelCanvas("wheelCanvasSingle", names, spState.currentAngle1);

  document.getElementById("btnShuffleSingle").onclick = () => {
    if (spState.remaining.length <= 1) return;
    spState.wheelOrder1 = shuffleArray([...spState.remaining]);
    drawWheelCanvas("wheelCanvasSingle", spState.wheelOrder1.map(u => unitLabel(u)), spState.currentAngle1);
    showToast("Tampilan di roda berhasil diacak!");
  };

  document.getElementById("btnResetSpinSingle").onclick = () => {
    if (confirm(isTOP22 ? "Reset ulang undian battle? Semua grup akan dibatalkan dari awal." : "Reset ulang undian babak ini?")) {
      const initialUnits = isTOP22 ? orderGroupsForSpin(buildGroups(participants)) : [...participants];
      window._spinnerState = {
        stage: cfg.activeStage,
        remaining: initialUnits,
        wheelOrder1: shuffleArray([...initialUnits]),
        assigned: [],
        currentAngle1: 0,
        spinCount: 0
      };
      renderSpinner(content);
    }
  };

  document.getElementById("btnSpinSingle").onclick = async () => {
    if (spState.remaining.length === 0) return;
    const btnSpin = document.getElementById("btnSpinSingle");
    const btnShuffle = document.getElementById("btnShuffleSingle");
    btnSpin.disabled = true;
    if (btnShuffle) btnShuffle.disabled = true;

    // Sama seperti babak lain: hasil SELALU unit paling depan di antrian
    // (urutan sudah diatur dari Google Sheets — untuk TOP22, per grup 2 orang).
    // Roda hanya diputar sampai berhenti tepat di label ini — murni gimmick
    // visual, bukan penentu hasil.
    const targetUnit = spState.remaining[0];
    const wheelNames = spState.wheelOrder1.map(u => unitLabel(u));
    const chosenIdx = spState.wheelOrder1.findIndex(u => unitLabel(u) === unitLabel(targetUnit));

    const slice = (2 * Math.PI) / wheelNames.length;
    const midAngle = chosenIdx * slice + slice / 2;
    let targetRot = (2 * Math.PI - midAngle) % (2 * Math.PI);
    if (targetRot < 0) targetRot += 2 * Math.PI;

    const finalAngle = spState.currentAngle1 + (6 * 2 * Math.PI) + (targetRot - (spState.currentAngle1 % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);

    animateSingleWheel("wheelCanvasSingle", wheelNames, spState.currentAngle1, finalAngle, async () => {
      spState.currentAngle1 = finalAngle;
      if (!spState.assigned) spState.assigned = [];
      spState.assigned.push(targetUnit);
      spState.remaining.splice(0, 1);
      spState.wheelOrder1 = shuffleArray([...spState.remaining]);

      let updatedParticipants;
      if (isTOP22) {
        const flatAssigned = [];
        spState.assigned.forEach(g => g.members.forEach(m => flatAssigned.push(m)));
        const flatRemaining = [];
        spState.remaining.forEach(g => g.members.forEach(m => flatRemaining.push(m)));
        updatedParticipants = [...flatAssigned, ...flatRemaining].map((p, idx) => ({ ...p, nomorUrut: idx + 1 }));
      } else {
        updatedParticipants = [
          ...spState.assigned,
          ...spState.remaining.map((p, idx) => ({ ...p, nomorUrut: spState.assigned.length + idx + 1 }))
        ];
      }

      // Simpan ke Google Sheets di background — tidak menahan UI.
      api("setParticipants", { stage: cfg.activeStage, participants: updatedParticipants })
        .catch(e => console.error("Gagal update Google Sheets", e));

      if (isTOP22) {
        showBattleResultModal(targetUnit, spState.remaining.length, () => {
          renderSpinner(content);
        });
      } else {
        showSpinnerResultModal(targetUnit, spState.remaining.length, () => {
          renderSpinner(content);
        });
      }
    });
  };
}

// Tabel hasil khusus babak Battle TOP22: setiap grup yang sudah diundi
// ditampilkan dengan label tetapnya ("Grup #1", "Grup #2", dst — sesuai
// urutan NomorUrut asli di Sheets) beserta kedua pesertanya.
function renderBattlePairsTable(assignedGroups) {
  const list = assignedGroups || [];
  if (list.length === 0) {
    return `
      <h3 class="font-display text-md text-cyan-300 mb-3">Tabel Hasil Spin / Pasangan Battle</h3>
      <p class="text-sm text-slate-500">Belum ada grup battle yang diundi.</p>
    `;
  }
  return `
    <h3 class="font-display text-md text-cyan-300 mb-3">Tabel Hasil Spin / Pasangan Battle (${list.length} Grup Terundi)</h3>
    <div class="space-y-3">
      ${list.map(group => {
        const p1 = group.members[0];
        const p2 = group.members[1];
        return `
        <div class="p-3 rounded-lg flex flex-col sm:flex-row sm:items-center justify-between gap-2" style="background:rgba(56,240,224,0.05);border:1px solid var(--line);">
          <div class="flex items-center gap-2">
            <span class="font-display text-amber-300 text-md">${group.label}</span>
          </div>
          <div class="flex items-center gap-3 justify-between flex-1 sm:justify-center">
            <div class="text-right flex-1">
              ${p1 ? `
                <div class="font-bold text-sm text-cyan-300">#${p1.nomorUrut} ${escapeHtml(p1.nama)}</div>
                <div class="text-xs text-slate-400">${escapeHtml(p1.lagu || '-')}</div>
              ` : `<div class="text-xs text-slate-500 italic">-</div>`}
            </div>
            <span class="font-display text-red-400 text-xs px-2 py-1 rounded bg-slate-900 border border-slate-700">VS</span>
            <div class="text-left flex-1">
              ${p2 ? `
                <div class="font-bold text-sm text-amber-300">#${p2.nomorUrut} ${escapeHtml(p2.nama)}</div>
                <div class="text-xs text-slate-400">${escapeHtml(p2.lagu || '-')}</div>
              ` : `<div class="text-xs text-slate-500 italic">Peserta ganjil — tanpa lawan</div>`}
            </div>
          </div>
        </div>
      `;
      }).join("")}
    </div>
  `;
}

// Tabel hasil untuk babak non-battle (sama seperti sebelumnya).
function renderPlainSpinTable(assigned) {
  const list = assigned || [];
  if (list.length === 0) {
    return `
      <h3 class="font-display text-md text-cyan-300 mb-3">Tabel Hasil Spin / Urutan Tampil</h3>
      <p class="text-sm text-slate-500">Belum ada peserta yang diundi.</p>
    `;

function drawWheelCanvas(canvasId, names, angle) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2, r = (w / 2) - 4;

  ctx.clearRect(0, 0, w, h);

  const n = names.length;
  if (n === 0) return;
  const slice = (2 * Math.PI) / n;

  const palette = [
    { bg: '#E52531', text: '#FFFFFF' }, 
    { bg: '#E9A321', text: '#000000' }, 
    { bg: '#38A538', text: '#FFFFFF' }, 
    { bg: '#2C6ED5', text: '#FFFFFF' }  
  ];

  const k = palette.length;
  const colorIndices = [];
  for (let i = 0; i < n; i++) {
    if (i === 0) {
      colorIndices[0] = 0;
    } else if (i === n - 1) {
      let candidate = (colorIndices[i - 1] + 1) % k;
      if (candidate === colorIndices[0]) {
        candidate = (candidate + 1) % k;
      }
      colorIndices[i] = candidate;
    } else {
      let candidate = (colorIndices[i - 1] + 1) % k;
      colorIndices[i] = candidate;
    }
  }

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.translate(-cx, -cy);

  for (let i = 0; i < n; i++) {
    const startA = i * slice;
    const endA = (i + 1) * slice;
    const color = palette[colorIndices[i]];

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startA, endA);
    ctx.closePath();

    ctx.fillStyle = color.bg;
    ctx.fill();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startA + slice / 2);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillStyle = color.text;

    let fontSize = Math.max(11, Math.min(18, Math.floor(220 / n)));
    ctx.font = `700 ${fontSize}px Arial, sans-serif`;

    let label = names[i];
    if (label.length > 12) label = label.substring(0, 10) + "..";

    ctx.fillText(label, r - 15, 0);
    ctx.restore();
  }

  ctx.restore();

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.22, 0, 2 * Math.PI);
  ctx.fillStyle = "#FFFFFF";
  ctx.fill();
  ctx.restore();
}

function animateDualWheels(id1, names1, startA1, targetA1, id2, names2, startA2, targetA2, done) {
  const start = performance.now();
  const duration = 4500;

  function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 4);

    const curr1 = startA1 + (targetA1 - startA1) * eased;
    const curr2 = startA2 + (targetA2 - startA2) * eased;

    drawWheelCanvas(id1, names1, curr1);
    drawWheelCanvas(id2, names2, curr2);

    if (t < 1) requestAnimationFrame(frame); else done();
  }
  requestAnimationFrame(frame);
}

function animateSingleWheel(id, names, startA, targetA, done) {
  const start = performance.now();
  const duration = 4000;

  function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 4);
    const curr = startA + (targetA - startA) * eased;

    drawWheelCanvas(id, names, curr);

    if (t < 1) requestAnimationFrame(frame); else done();
  }
  requestAnimationFrame(frame);
}

// Normalisasi nama peserta pada entri solo maupun duet/trio.
// Skor performa grup dikreditkan ke setiap anggota grup agar total individu
// merupakan gabungan skor solo dan skor duet/trio yang diikutinya.
function trendIndividualNames(rowName, knownNames) {
  const raw = String(rowName || "").trim();
  if (!raw) return [];
  const normalized = raw.toLocaleLowerCase("id-ID");
  const isWordChar = ch => !!ch && /[\p{L}\p{N}]/u.test(ch);
  const containsWholeName = name => {
    const needle = String(name || "").trim().toLocaleLowerCase("id-ID");
    if (!needle) return false;
    let from = 0;
    while (true) {
      const at = normalized.indexOf(needle, from);
      if (at < 0) return false;
      const before = at > 0 ? normalized[at - 1] : "";
      const afterIndex = at + needle.length;
      const after = afterIndex < normalized.length ? normalized[afterIndex] : "";
      if (!isWordChar(before) && !isWordChar(after)) return true;
      from = at + 1;
    }
  };
  const individualNames = [...new Set((knownNames || [])
    .map(n => String(n || "").trim())
    .filter(Boolean))]
    .sort((a,b) => b.length - a.length);
  const matched = individualNames.filter(containsWholeName);
  if (matched.length) return matched;
  // Nama tunggal tetap dapat direkap meskipun belum ada di daftar cache.
  const hasGroupSeparator = /[&+,/]/.test(raw) ||
    /\b(dan|feat|ft)\b/i.test(raw) ||
    /\s+x\s+/i.test(raw);
  return hasGroupSeparator ? [] : [raw];
}

function aggregateTrendRows(rows, knownNames) {
  const totals = new Map();
  (rows || []).forEach(row => {
    const score = Number(row.total ?? row.effectiveTotal ?? row.totalEfektif ?? 0);
    if (!Number.isFinite(score)) return;
    trendIndividualNames(row.nama, knownNames).forEach(name => {
      totals.set(name, (totals.get(name) || 0) + score);
    });
  });
  return totals;
}

async function fetchTrendStage(stage, juri) {
  const params = { stage };
  if (juri) params.juri = juri;
  const data = await api("getRecap", params);
  return aggregateTrendRows(data.recap || [], window._trendInitCache?.names || []);
}

async function updateTrendView() {
  const modeEl = document.getElementById("selTrendMode");
  const chartContainer = document.getElementById("chartContainer");
  if (!modeEl || !chartContainer) return;
  chartContainer.style.opacity = "0.5";
  const juriEl = document.getElementById("selTrendJuri");
  const juri = juriEl ? juriEl.value : "";
  const juriLabel = juri ? ` (${juri})` : " (Total Seluruh Juri)";
  const knownNames = (window._trendInitCache && window._trendInitCache.names) || [];

  try {
    if (modeEl.value === "stage") {
      const stageEl = document.getElementById("selTrendStage");
      const stage = stageEl ? stageEl.value : STAGES[0];
      const totals = await fetchTrendStage(stage, juri);
      const entries = [...totals.entries()].sort((a,b) => b[1] - a[1]);
      drawTrendChart(entries.map(e => e[0]), entries.map(e => Number(e[1].toFixed(2))),
        `Total Per Peserta — ${stage}${juriLabel}`);
    } else if (modeEl.value === "participant") {
      const pEl = document.getElementById("selTrendPeserta");
      const nama = pEl ? pEl.value : "";
      if (!nama) { chartContainer.style.opacity = "1"; return; }
      const stageMaps = await Promise.all(STAGES.map(stage => fetchTrendStage(stage, juri)));
      const labels = [];
      const values = [];
      stageMaps.forEach((totals, i) => {
        if (totals.has(nama)) {
          labels.push(STAGES[i]);
          values.push(Number(totals.get(nama).toFixed(2)));
        }
      });
      drawTrendChart(labels, values, `Total Per Babak: ${nama}${juriLabel}`);
    } else if (modeEl.value === "combined") {
      const stageMaps = await Promise.all(STAGES.map(stage => fetchTrendStage(stage, juri)));
      const totals = new Map();
      stageMaps.forEach(map => map.forEach((score, name) => {
        totals.set(name, (totals.get(name) || 0) + score);
      }));
      const entries = [...totals.entries()].sort((a,b) => b[1] - a[1]);
      if (!entries.length) {
        showToast("Belum ada data rekap gabungan", true);
      } else {
        drawTrendChart(entries.map(e => e[0]), entries.map(e => Number(e[1].toFixed(2))),
          `Akumulasi Nilai Seluruh Babak per Peserta${juriLabel}`);
      }
    }
  } catch (e) {
    showToast("Gagal memuat data trend. Silakan coba kembali.", true);
  } finally {
    chartContainer.style.opacity = "1";
  }
}

let trendChartInstance = null;
function drawTrendChart(labels, values, datasetLabel = "Nilai Total") {
  const canvas = document.getElementById("trendChart");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  if (trendChartInstance) trendChartInstance.destroy();

  trendChartInstance = new Chart(ctx, {
    type: "bar",
    data: {
      labels: labels,
      datasets: [{
        label: datasetLabel,
        data: values,
        backgroundColor: "rgba(122, 86, 255, 0.66)",
        borderColor: "#42d9ff",
        borderWidth: 1.5,
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          ticks: { color: "#aab1cf", font: { size: 11 } },
          grid: { color: "rgba(112,115,163,.18)" }
        },
        y: {
          beginAtZero: true,
          ticks: { color: "#aab1cf", font: { size: 11 } },
          grid: { color: "rgba(112,115,163,.18)" }
        }
      },
      plugins: {
        legend: {
          display: true,
          labels: { color: "#f4f6ff", font: { size: 12 } }
        },
        tooltip: {
          backgroundColor: "#08081e",
          titleColor: "#42d9ff",
          bodyColor: "#f4f6ff",
          borderColor: "rgba(122,86,255,.55)",
          borderWidth: 1
        }
      }
    }
  });
}

// Warna ranking hanya dipakai di Rekap Admin. Panel Juri sengaja tidak
// memiliki warna berdasarkan total/ranking agar penilaian berikutnya tidak bias.
function rankColorStyle(rankFromBottom) {
  if (rankFromBottom <= 3) return "background:rgba(255,92,108,0.15)";
  if (rankFromBottom <= 5) return "background:rgba(255,179,71,0.13)";
  return "background:rgba(61,220,132,0.10)";
}

function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

render();

// Memuat Chart.js secara asinkron hanya saat diperlukan
function loadChartJs() {
  return new Promise((resolve) => {
    if (window.Chart) return resolve();
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js";
    script.onload = resolve;
    document.head.appendChild(script);
  });
}

</script>
